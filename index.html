<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT_ACCESS // SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="side-panel left-panel" id="left-panel"></div>
    <div class="terminal-window">
        <div class="terminal-header">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="terminal-title">root@system: ~/visiting_card</span>
        </div>
        <div class="terminal-body" id="terminal-output">
            <div class="terminal-line">System initialized.</div>
            <div class="terminal-line">Type <span class="highlight">'help'</span> to see commands.</div>
        </div>
        <div class="terminal-input-line">
            <span class="prompt-user">root@system:~$</span>
            <input type="text" id="terminal-input" autocomplete="off" autofocus>
        </div>
    </div>
    <div class="side-panel right-panel" id="right-panel"></div>
    <script src="script.js"></script>
</body>
</html>
